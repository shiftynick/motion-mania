name: Bug report
description: Report a reproducible CLI or rendering problem.
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Expected behavior and actual behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Exact command and a minimal project or source snippet with no private data.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: OS, Node version, Motion Mania version, and doctor output. Remove personal paths if needed.
    validations:
      required: true
